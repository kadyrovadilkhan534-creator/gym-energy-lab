name: Render physics animation
on:
  push:
    paths: ['gym_energy_animation.py', 'model.py', '.github/workflows/render-animation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config ffmpeg
      - run: pip install manim==0.19.0
      - run: manim -qm gym_energy_animation.py StackEnergy
      - run: |
          cp media/videos/gym_energy_animation/720p30/StackEnergy.mp4 media/stack_energy.mp4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/stack_energy.mp4
          git diff --cached --quiet || git commit -m 'Render model-backed physics animation'
          git push
